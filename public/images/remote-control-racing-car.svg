<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF"/>
      <stop offset="100%" style="stop-color:#ECFEFF"/>
    </linearGradient>
    <linearGradient id="body1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#DC2626"/>
    </linearGradient>
    <linearGradient id="roof1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626"/>
      <stop offset="100%" style="stop-color:#B91C1C"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1)" rx="24"/>
  
  <!-- Sparkles -->
  <circle cx="55" cy="65" r="4" fill="#FBBF24" opacity="0.7"/>
  <circle cx="345" cy="85" r="3" fill="#3B82F6" opacity="0.6"/>
  <circle cx="65" cy="330" r="3.5" fill="#06B6D4" opacity="0.5"/>
  <circle cx="335" cy="310" r="4" fill="#EC4899" opacity="0.6"/>
  <circle cx="50" cy="190" r="2.5" fill="#22C55E" opacity="0.5"/>
  <circle cx="355" cy="200" r="3" fill="#F97316" opacity="0.5"/>
  
  <!-- Stars -->
  <path d="M48 130 L50 136 L56 136 L51 140 L53 146 L48 142 L43 146 L45 140 L40 136 L46 136Z" fill="#FBBF24" opacity="0.6"/>
  <path d="M348 155 L350 161 L356 161 L351 165 L353 171 L348 167 L343 171 L345 165 L340 161 L346 161Z" fill="#3B82F6" opacity="0.5"/>
  
  <!-- Racing Car -->
  <g transform="translate(40, 130)">
    <!-- Shadow -->
    <ellipse cx="160" cy="155" rx="130" ry="12" fill="#CBD5E1" opacity="0.3"/>
    
    <!-- Car body -->
    <rect x="30" y="70" width="230" height="65" rx="15" fill="url(#body1)"/>
    
    <!-- Roof -->
    <path d="M80 70 L105 25 L175 25 L200 70" fill="url(#roof1)"/>
    
    <!-- Windows -->
    <path d="M108 28 L95 65 L140 65 L140 28Z" fill="#93C5FD" opacity="0.9"/>
    <path d="M145 28 L145 65 L190 65 L177 28Z" fill="#93C5FD" opacity="0.9"/>
    <!-- Window shine -->
    <path d="M112 32 L102 58 L115 58 L115 32Z" fill="white" opacity="0.3"/>
    <path d="M149 32 L149 58 L162 58 L152 32Z" fill="white" opacity="0.3"/>
    
    <!-- Hood -->
    <rect x="200" y="80" width="65" height="45" rx="10" fill="#F87171"/>
    
    <!-- Headlights -->
    <ellipse cx="262" cy="92" rx="7" ry="6" fill="#FDE68A"/>
    <ellipse cx="262" cy="92" rx="3" ry="2.5" fill="white" opacity="0.6"/>
    
    <!-- Tail lights -->
    <ellipse cx="38" cy="92" rx="6" ry="5" fill="#FCA5A5"/>
    
    <!-- Bumper -->
    <rect x="25" y="128" width="240" height="8" rx="4" fill="#B91C1C"/>
    
    <!-- Racing stripes -->
    <rect x="40" y="95" width="160" height="5" rx="2.5" fill="#FBBF24" opacity="0.7"/>
    <rect x="40" y="105" width="160" height="3" rx="1.5" fill="#FBBF24" opacity="0.4"/>
    
    <!-- Number -->
    <circle cx="160" cy="100" r="18" fill="white" opacity="0.9"/>
    <text x="160" y="107" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#DC2626" text-anchor="middle">7</text>
    
    <!-- Spoiler -->
    <rect x="22" y="58" width="18" height="14" rx="4" fill="#B91C1C"/>
    <rect x="18" y="52" width="26" height="8" rx="3" fill="#DC2626"/>
    
    <!-- Rear wheel -->
    <circle cx="85" cy="140" r="28" fill="#1E293B"/>
    <circle cx="85" cy="140" r="18" fill="#475569"/>
    <circle cx="85" cy="140" r="10" fill="#94A3B8"/>
    <circle cx="85" cy="140" r="4" fill="#CBD5E1"/>
    <!-- Wheel spokes -->
    <line x1="85" y1="122" x2="85" y2="158" stroke="#64748B" stroke-width="2"/>
    <line x1="67" y1="140" x2="103" y2="140" stroke="#64748B" stroke-width="2"/>
    <line x1="72" y1="127" x2="98" y2="153" stroke="#64748B" stroke-width="1.5"/>
    <line x1="72" y1="153" x2="98" y2="127" stroke="#64748B" stroke-width="1.5"/>
    
    <!-- Front wheel -->
    <circle cx="210" cy="140" r="28" fill="#1E293B"/>
    <circle cx="210" cy="140" r="18" fill="#475569"/>
    <circle cx="210" cy="140" r="10" fill="#94A3B8"/>
    <circle cx="210" cy="140" r="4" fill="#CBD5E1"/>
    <!-- Wheel spokes -->
    <line x1="210" y1="122" x2="210" y2="158" stroke="#64748B" stroke-width="2"/>
    <line x1="192" y1="140" x2="228" y2="140" stroke="#64748B" stroke-width="2"/>
    <line x1="197" y1="127" x2="223" y2="153" stroke="#64748B" stroke-width="1.5"/>
    <line x1="197" y1="153" x2="223" y2="127" stroke="#64748B" stroke-width="1.5"/>
    
    <!-- Tire treads -->
    <rect x="62" y="132" width="4" height="16" rx="1" fill="#334155" opacity="0.5"/>
    <rect x="70" y="130" width="4" height="20" rx="1" fill="#334155" opacity="0.5"/>
    <rect x="78" y="130" width="4" height="20" rx="1" fill="#334155" opacity="0.5"/>
    <rect x="86" y="130" width="4" height="20" rx="1" fill="#334155" opacity="0.5"/>
    <rect x="94" y="132" width="4" height="16" rx="1" fill="#334155" opacity="0.5"/>
    <rect x="187" y="132" width="4" height="16" rx="1" fill="#334155" opacity="0.5"/>
    <rect x="195" y="130" width="4" height="20" rx="1" fill="#334155" opacity="0.5"/>
    <rect x="203" y="130" width="4" height="20" rx="1" fill="#334155" opacity="0.5"/>
    <rect x="211" y="130" width="4" height="20" rx="1" fill="#334155" opacity="0.5"/>
    <rect x="219" y="132" width="4" height="16" rx="1" fill="#334155" opacity="0.5"/>
  </g>
  
  <!-- Ground -->
  <ellipse cx="200" cy="365" rx="170" ry="15" fill="#DBEAFE" opacity="0.4"/>
</svg>