    <rect x="-20" y="255" width="35" height="30" rx="5" fill="#FBBF24" stroke="#F59E0B" stroke-width="1.5" transform="rotate(-15, -2, 270)"/>
    <rect x="275" y="260" width="35" height="30" rx="5" fill="#3B82F6" stroke="#2563EB" stroke-width="1.5" transform="rotate(10, 292, 275)"/>
    <rect x="250" y="240" width="25" height="25" rx="4" fill="#22C55E" stroke="#16A34A" stroke-width="1.5" transform="rotate(20, 262, 252)"/>
  </g>
  
  <!-- Ground -->
  <ellipse cx="200" cy="370" rx="170" ry="15" fill="#D1FAE5" opacity="0.4"/>
</svg>